<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MChat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f8f7ff;color:#1e1b4b}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#a78bfa,#818cf8,#c084fc,#f0abfc)}
.logo{width:90px;height:90px;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.6);border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:white}
h1{color:white;font-size:52px;margin:10px 0 2px}
.sub{color:rgba(255,255,255,.85);margin-bottom:22px}
.card{background:rgba(255,255,255,.35);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.6);border-radius:28px;padding:22px;width:100%;max-width:360px}
.inp{display:flex;gap:10px;background:rgba(255,255,255,.55);border-radius:16px;padding:14px;margin-bottom:14px}
.inp input{border:none;outline:none;background:transparent;width:100%;font-size:16px}
.btn{width:100%;padding:15px;border:none;border-radius:16px;background:rgba(255,255,255,.45);border:1px solid white;color:white;font-size:18px;font-weight:700}
.link{text-align:center;color:white;margin-top:16px;font-size:14px}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:#f8f7ff;display:flex;flex-direction:column}
.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:white}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;flex-shrink:0;object-fit:cover;overflow:hidden;background:linear-gradient(135deg,#818cf8,#c084fc)}
.avatar img{width:100%;height:100%;object-fit:cover}
.search{margin:10px 14px;background:#f1f5f9;border-radius:14px;padding:12px;display:flex;gap:8px}
.search input{border:none;outline:none;background:transparent;width:100%}
.tabs{display:flex;gap:8px;padding:0 14px 10px}
.tab{padding:8px 18px;border-radius:20px;background:#eef2ff;font-size:14px;font-weight:600}
.chat-item{display:flex;gap:12px;padding:14px;border-bottom:1px solid #f1f5f9;align-items:center;background:white}
.chat-item .info{flex:1}.chat-item .info p{font-size:13px;color:#64748b}
.chat-head{padding:12px;display:flex;align-items:center;gap:10px;background:white}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;background:#fcfcff;min-height:400px}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15px;background:white;box-shadow:0 2px 8px rgba(0,0,0,.06);align-self:flex-start}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#c4b5fd,#818cf8);color:white}
.msg small{display:block;font-size:11px;opacity:.7}
.date{text-align:center;font-size:12px;background:white;padding:5px 12px;border-radius:12px;color:#64748b;margin:6px auto}
.input-bar{padding:10px;display:flex;gap:8px;background:white;align-items:center}
.input-bar input{flex:1;background:#f1f5f9;border:none;outline:none;padding:13px 16px;border-radius:20px;font-size:15px}
.send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#a78bfa,#6366f1);color:white;font-size:20px}
.prof{padding:16px}
.prof-card{background:linear-gradient(135deg,#e0e7ff,#ddd6fe);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}
.prof-btns{display:flex;gap:8px;margin-top:10px}
.pbtn{flex:1;background:white;border:1px solid #e2e8f0;padding:8px 6px;border-radius:20px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;cursor:pointer}
.pbtn:first-child{background:linear-gradient(135deg,#c4b5fd,#818cf8);color:white;border:none}
.set-title{font-size:19px;font-weight:800;margin:20px 0 10px}
.set{background:white;border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.set-row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #f8fafc;cursor:pointer}
.set-row:last-child{border:none}
.icon-box{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:white}
.set-row b{font-size:15px;display:block}
.set-row small{color:#64748b;font-size:13px}
.set-row .arr{margin-left:auto;color:#94a3b8;font-size:18px}
.switch{width:52px;height:30px;background:linear-gradient(135deg,#c4b5fd,#f0abfc);border-radius:20px;position:relative;margin-left:auto;flex-shrink:0;cursor:pointer}
.switch::after{content:'';width:24px;height:24px;background:white;border-radius:50%;position:absolute;right:3px;top:3px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.off{background:#cbd5e1}.switch.off::after{right:auto;left:3px}
.nav{height:60px;background:white;display:flex;justify-content:space-around;align-items:center;font-size:22px;border-top:1px solid #eee}
.nav span{opacity:.35}.nav span.on{opacity:1}
.detail{padding:16px}.detail-card{background:white;border-radius:18px;padding:16px;margin-bottom:12px}.detail-card input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:12px;margin-top:6px;font-size:15px;outline:none}
.bigbtn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#a78bfa,#6366f1);color:white;font-weight:700;font-size:16px;margin-top:12px}
.tgbtn{width:100%;padding:14px;border:none;border-radius:14px;background:#229ED9;color:white;font-weight:700;font-size:16px;margin-top:12px;display:block;text-align:center;text-decoration
